name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.1', '3.2', '3.3', '3.4']

    steps:
      - uses: actions/checkout@v7.0.0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Compile C extension and run specs
        run: bundle exec rake

      - name: Build gem
        if: matrix.ruby == '3.4'
        run: bundle exec rake build

      - name: Upload gem artifact
        if: matrix.ruby == '3.4'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: data-redactor-gem
          path: pkg/

  alloc-gate:
    name: Zero-allocation hot-path gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      # No Ruby needed: the gate compiles the matcher engine standalone and
      # asserts the steady-state hot path allocates nothing. Deterministic, so
      # it is a hard gate (unlike throughput, which is too noisy on CI runners).
      - name: Build and run the allocation-regression gate
        run: benchmark/run_alloc_gate.sh

  asan-fuzz-gate:
    name: ASan/UBSan memory-safety gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      # No Ruby needed: builds the matcher engine standalone under
      # -fsanitize=address,undefined and drives it over an adversarial corpus +
      # a seeded fuzz loop. The v19.1 OP_EOL out-of-bounds read was found by
      # ASan and is invisible to the Ruby specs; this gate catches that class.
      # Deterministic (fixed corpus + fixed seed) -> hard gate, like alloc-gate.
      - name: Build and run the ASan/UBSan fuzz gate
        run: benchmark/run_asan_fuzz.sh

  throughput-gate:
    name: Relative throughput regression gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      # Absolute MB/s is too noisy to gate on (5-15% runner variance), but the
      # RATIO of the C engine to a pure-Ruby gsub loop running the SAME patterns
      # cancels runner speed: a slow runner slows both paths equally. We gate on
      # that ratio with a loose floor (known result ~2.25x; floor 1.5x), so the
      # job only trips on a real regression. Throughput is printed informationally.
      - name: Compile C extension
        run: bundle exec rake compile

      - name: Run the relative-throughput gate
        run: bundle exec ruby benchmark/ci_throughput_gate.rb

  throughput-trend:
    name: Throughput-trend history + PR comment
    runs-on: ubuntu-latest
    needs: test

    # The in-PR throughput-gate enforces a hard floor but keeps no history, so
    # slow drift across many small PRs is invisible. This job records the C/Ruby
    # ratio over time and surfaces it: a cached JSON series holds the history,
    # benchmark/throughput_trend.rb compares each run to the previous point,
    # posts the result as a PR comment, and fails on a >10% ratio drop.
    #
    # No gh-pages branch (the docs job already owns Pages via the Actions deploy
    # path) and no github-action-benchmark: that tool only posts COMMIT comments,
    # not PR-thread comments, and couples history to gh-pages. We keep history in
    # actions/cache and post with the built-in gh CLI — no third-party action.

    permissions:
      contents: read
      pull-requests: write   # gh pr comment posts the trend to the PR thread

    steps:
      - uses: actions/checkout@v7.0.0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Compile C extension
        run: bundle exec rake compile

      # Reuses the gate; BENCHMARK_JSON makes it also emit the ratio (ratio only
      # — absolute i/s is too runner-noisy to track; see the gate).
      - name: Measure throughput ratio
        run: BENCHMARK_JSON=ratio.json bundle exec ruby benchmark/ci_throughput_gate.rb

      # restore-keys lets a PR read the latest main baseline even though its own
      # run_id-keyed entry has no prior hit. The series is plain JSON; nothing is
      # committed or pushed.
      - name: Restore throughput history
        uses: actions/cache/restore@v6.1.0
        with:
          path: ./bench-cache
          key: throughput-history-${{ github.run_id }}
          restore-keys: |
            throughput-history-

      # Compare vs. the previous point and write the comment body. APPEND=1 only
      # on push to main: PR runs compare against the baseline but must not advance
      # the series, so the history stays a clean record of merged commits. A drop
      # >10% makes the script exit non-zero; pipefail propagates that through the
      # tee so the step (and job) fails.
      - name: Compare against baseline
        id: trend
        env:
          RATIO_JSON: ratio.json
          HISTORY: ./bench-cache/history.json
          COMMIT: ${{ github.sha }}
          APPEND: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && '1' || '0' }}
        run: |
          set -o pipefail
          mkdir -p bench-cache
          ruby benchmark/throughput_trend.rb | tee comment.md

      # Post the trend to the PR thread. Sticky: edit the existing comment if one
      # exists (identified by the marker), else create it — so a PR with many
      # pushes keeps one comment, not a stack. `!cancelled()` so it still runs
      # when the compare step FAILED on a regression, making the drop visible on
      # the PR; skipped only if the run was cancelled.
      - name: Post PR comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- throughput-trend -->'
          body="$marker"$'\n'"$(cat comment.md)"
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
                 --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -f body="$body" >/dev/null
            echo "updated comment $id"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$body" >/dev/null
            echo "created comment"
          fi

      # Advance the series only on push to main (the record of merged commits).
      - name: Save throughput history
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6.1.0
        with:
          path: ./bench-cache
          key: throughput-history-${{ github.run_id }}

  cross-compile-smoke:
    name: Cross-compile smoke test (x86_64-linux)
    runs-on: ubuntu-latest
    needs: test

    # Verifies the rake-compiler-dock cross-compile path actually works on
    # every PR / push to main. Builds one platform end-to-end (no publish).
    # Catches Rakefile / workflow / image-tag breakage before release time.
    # The full 6-platform build still runs only on release-binaries.yml.

    steps:
      - uses: actions/checkout@v7.0.0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Build native gem for x86_64-linux
        run: |
          bundle exec ruby -r rake_compiler_dock -e \
            'RakeCompilerDock.sh("bundle install --jobs $(nproc) && bundle exec rake native:data_redactor:x86_64-linux gem", platform: "x86_64-linux")'

      - name: Verify native gem contents
        run: |
          set -e
          gem_file=$(ls pkg/data_redactor-*-x86_64-linux.gem | head -1)
          echo "Built: $gem_file ($(du -h "$gem_file" | cut -f1))"
          mkdir -p /tmp/inspect && cd /tmp/inspect
          tar -xf "$GITHUB_WORKSPACE/$gem_file"
          echo "Contents:"
          tar -tzf data.tar.gz | sort
          echo "---"
          # Sanity checks: must contain .so files, must NOT contain ext/ sources
          tar -tzf data.tar.gz | grep -q '\.so$' || (echo "FAIL: no .so files in native gem"; exit 1)
          if tar -tzf data.tar.gz | grep -q '^ext/'; then
            echo "FAIL: ext/ sources leaked into native gem"; exit 1
          fi
          echo "OK: native gem contains compiled .so, no ext/ sources"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: native-gem-x86_64-linux-smoke
          path: pkg/data_redactor-*-x86_64-linux.gem
          if-no-files-found: error

  musl-load:
    name: musl/Alpine load test
    runs-on: ubuntu-latest
    needs: test
    container: ruby:3.3-alpine

    # Compiles the C extension against musl libc and LOADS the gem. The release
    # pipeline cross-compiles the .so but never `require`s it, so musl-only
    # runtime failures shipped undetected (0.10.0: a built-in pattern's {m,n}
    # interval exceeded POSIX RE_DUP_MAX (255), which musl's regcomp rejects at
    # module init but glibc accepts). This job runs the same regcomp path on musl.
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Install build toolchain
        run: apk add --no-cache build-base

      - name: Compile extension on musl
        run: |
          set -e
          cd ext/data_redactor
          ruby extconf.rb
          make
          cp data_redactor.so "$GITHUB_WORKSPACE/lib/data_redactor/"

      - name: Load gem and smoke-test redaction on musl
        run: |
          set -e
          ruby -Ilib -e '
            require "data_redactor"
            # Exact-output checks for patterns that redact to a single placeholder.
            exact = {
              "AWS key"  => [DataRedactor.redact("k=AKIAIOSFODNN7EXAMPLE x"), "k=[REDACTED] x"],
              "GitHub"   => [DataRedactor.redact("t ghp_16C7e42F292c6912E7710c838347Ae178B4a x"), "t [REDACTED] x"],
              "SSN(EOL)" => [DataRedactor.redact("ssn 123-45-6789"), "ssn [REDACTED]"],
              "IBAN(EOL)"=> [DataRedactor.redact("iban DE89370400440532013000"), "iban [REDACTED]"],
              "email"    => [DataRedactor.redact("to alice@example.com now"), "to [REDACTED] now"],
            }
            # The hvb pattern (the one that exceeded RE_DUP_MAX) — assert it
            # compiles on musl and neutralizes the token, not a specific layout.
            hvb_token = "hvb." + "B" * 150
            hvb_out = DataRedactor.redact("t=" + hvb_token + " x")
            failed = exact.reject { |_, (got, want)| got == want }
            exact.each_key { |k| puts "  ok  #{k}" unless failed.key?(k) }
            failed.each { |k, (got, want)| puts "FAIL  #{k}: got #{got.inspect} want #{want.inspect}" }
            if hvb_out.include?("[REDACTED]") && !hvb_out.include?(hvb_token)
              puts "  ok  hvb token (neutralized)"
            else
              puts "FAIL  hvb token: got #{hvb_out.inspect}"
              failed["hvb token"] = true
            end
            abort "musl smoke test failed" unless failed.empty?
            puts "ALL #{exact.size + 1} musl checks passed"
          '

      # The glibc alloc-gate job verifies the zero-allocation hot path on glibc
      # only. Run the same gate here so the invariant is also enforced against
      # musl libc (different malloc arena; a libc call that allocates on musl but
      # not glibc would otherwise ship undetected). build-base above provides cc;
      # the gate needs no Ruby. Deterministic -> hard gate, same as on glibc.
      - name: Zero-allocation hot-path gate (musl)
        run: benchmark/run_alloc_gate.sh

# Note: source-gem publishing was moved to release-binaries.yml as of 0.7.2.
# That workflow builds the source gem AND all 6 native gems atomically and
# publishes them in a single step, so a native build failure can never leave
# users with a source-only release that promised binaries (the 0.7.1 bug).

  docs:
    name: Build and deploy YARD docs to GitHub Pages
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7.0.0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Build YARD docs
        run: bundle exec yard doc

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: doc

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
