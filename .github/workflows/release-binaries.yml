name: Release gems (source + precompiled binaries)

# Atomic release pipeline. Builds the source gem AND every precompiled
# native gem, then publishes ALL of them to RubyGems in a single step.
# If any build fails, nothing is published.
#
# Triggers:
#   - release.published: automatic on every GitHub release
#   - workflow_dispatch: re-run manually to rebuild & republish at any time
#     (useful if a build flakes, or to backfill binaries for an old release)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag/branch/SHA) to build from. Defaults to the workflow's checkout ref."
        required: false
        default: ""
      publish:
        description: "Publish to RubyGems? Set to 'false' for a dry-run that only builds artifacts."
        required: false
        default: "true"

jobs:
  build-source:
    name: Build source gem
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Build source gem
        run: bundle exec rake build

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: source-gem
          path: pkg/data_redactor-*.gem
          if-no-files-found: error

  build-native:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        platform:
          - x86_64-linux
          - aarch64-linux
          - x86_64-linux-musl
          - aarch64-linux-musl
          - x86_64-darwin
          - arm64-darwin

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      # Use the same rake-compiler-dock code path that `rake gem:all` uses
      # locally and that the ci.yml smoke test exercises on every PR.
      # Images come from ghcr.io/rake-compiler/* (no Docker Hub rate limit).
      - name: Build native gem for ${{ matrix.platform }}
        run: |
          bundle exec ruby -r rake_compiler_dock -e \
            'RakeCompilerDock.sh("bundle install --jobs $(nproc) && bundle exec rake native:data_redactor:${{ matrix.platform }} gem", platform: "${{ matrix.platform }}")'

      - name: Verify native gem contents
        run: |
          set -e
          gem_file=$(ls pkg/data_redactor-*-${{ matrix.platform }}.gem | head -1)
          echo "Built: $gem_file ($(du -h "$gem_file" | cut -f1))"
          mkdir -p /tmp/inspect && cd /tmp/inspect
          tar -xf "$GITHUB_WORKSPACE/$gem_file"
          echo "Contents:"
          tar -tzf data.tar.gz | sort
          echo "---"
          # Compiled extension is .so on Linux, .bundle on macOS (target platform's DLEXT).
          if ! tar -tzf data.tar.gz | grep -qE '\.(so|bundle)$'; then
            echo "FAIL: no compiled extension (.so or .bundle) in native gem"
            exit 1
          fi
          if tar -tzf data.tar.gz | grep -q '^ext/'; then
            echo "FAIL: ext/ leaked into native gem"; exit 1
          fi
          echo "OK: native gem contains compiled extension, no ext/ sources"

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: native-gem-${{ matrix.platform }}
          path: pkg/data_redactor-*-${{ matrix.platform }}.gem
          if-no-files-found: error

  publish:
    name: Publish all gems to RubyGems (OIDC)
    runs-on: ubuntu-latest
    # CRITICAL: needs both build-source AND build-native. If any platform's
    # build-native job fails, this job is skipped and NOTHING publishes.
    # That's the whole point of this workflow's structure -- atomic release.
    needs: [build-source, build-native]
    # Skip publish on workflow_dispatch when the user passes publish=false
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish != 'false')

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - uses: actions/download-artifact@v4.1.8
        with:
          path: pkg
          pattern: "*gem*"
          merge-multiple: true

      - name: List all gems to publish
        run: |
          ls -la pkg/
          echo "---"
          echo "Total gems: $(ls pkg/*.gem | wc -l) (expect 7: 1 source + 6 native)"

      - name: Configure RubyGems OIDC credentials
        uses: rubygems/configure-rubygems-credentials@main

      - name: Push all gems
        run: |
          set -e
          for gem in pkg/data_redactor-*.gem; do
            echo "Pushing $gem"
            gem push "$gem"
          done
